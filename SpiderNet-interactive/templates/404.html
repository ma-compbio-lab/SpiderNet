{% extends "base.html" %}

{% block title %}Page not found — {{ app_title }}{% endblock %}

{% block content %}
<div class="container" style="max-width: 720px;">
    <section class="hero text-center fx-rise" style="border-bottom: none; padding-block: var(--space-3xl);">
        <p class="eyebrow" style="justify-content: center; display: inline-flex;">Error · 404</p>
        <h1 class="hero__title" style="margin-inline: auto; max-width: 16ch;">
            Page <em>not&nbsp;found</em>
        </h1>
        <p class="hero__lede mx-auto" style="max-width: 50ch;">
            The page you're looking for doesn't exist or has been moved. The dataset may have been renamed or removed.
        </p>
        <div class="d-flex justify-content-center gap-2 mt-4">
            <a href="{{ url_for('index') }}" class="btn btn-primary">Home</a>
            <a href="javascript:history.back()" class="btn btn-outline-secondary">Go back</a>
        </div>
    </section>
</div>
{% endblock %}
