[build-system]
requires = ["setuptools>=77.0.3", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "spidernet"
version = "0.1.0"
description = "SpiderNet: interpretable modeling of spatial cell-cell meta-interactions"
readme = "README.md"
requires-python = ">=3.11,<3.12"
authors = [
    { name = "Junjie Tang" }
]
license = "MIT"

dependencies = [
    "numpy>=1.26,<2.0",
    "pandas>=2.2",
    "scipy>=1.11",
    "scikit-learn>=1.3",
    "anndata>=0.10",
    "scanpy>=1.10",
    "h5py>=3.10",
    "matplotlib>=3.8",
    "seaborn>=0.13",
    "networkx>=3.0",
    "statsmodels>=0.14",
    "gseapy>=1.1",
    "umap-learn>=0.5",
    "tqdm>=4.60",
    "joblib>=1.3"
]

[project.optional-dependencies]
dev = [
    "pytest",
    "jupyter",
    "ipykernel",
    "build",
    "twine"
]

tutorial = [
    "jupyter",
    "jupyterlab",
    "ipykernel",
    "ipython",
    "ipywidgets",
    "openpyxl",
    "plotly",
    "kaleido"
]

interactive = [
    "requests>=2.31",
    "flask>=3.0,<4.0",
    "Werkzeug>=3.0,<4.0",
    "dash",
    "plotly>=5.20",
    "kaleido",
    "igraph==0.11.9",
    "louvain==0.8.2",
    "leidenalg==0.10.2",
    "setuptools<82"
]

benchmark = [
    "commot==0.0.3",
    "karateclub==1.2.2",
    "numpy==1.26.4",
    "igraph==0.11.9",
    "python-igraph==0.11.9",
    "leidenalg==0.10.2",
    "pysal==25.7",
    "tobler==0.12.1"
]

[tool.setuptools]
packages = ["SpiderNet"]
include-package-data = true
package-dir = {"" = "SpiderNet"}

[tool.setuptools.package-data]
SpiderNet = ["resources/*.csv"]
